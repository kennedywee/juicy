<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Head circle plus an overlapping tapered tail. Sharing one fill makes
         them read as a single comma, and the head hides the tail's base. In
         this local frame the head sits at the origin with the disc centre at
         +y, so the tail leaves tangentially and curves back around it. -->
    <g id="tomoe">
      <circle cx="0" cy="0" r="17"/>
      <path d="M 1,-17
               C 22,-19 42,-10 52,8
               C 38,2 22,6 13,12 Z"/>
    </g>
  </defs>
  <circle cx="128" cy="128" r="124" fill="#17141a"/>
  <circle cx="128" cy="128" r="113" fill="#c1121f"/>
  <circle cx="128" cy="128" r="21" fill="#17141a"/>
  <g fill="#17141a">
    <use href="#tomoe" transform="translate(128,128) rotate(0) translate(0,-62)"/>
    <use href="#tomoe" transform="translate(128,128) rotate(120) translate(0,-62)"/>
    <use href="#tomoe" transform="translate(128,128) rotate(240) translate(0,-62)"/>
  </g>
</svg>
